name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false

      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Unpack Project ZIP
        run: |
          if [ -f project.zip ]; then
            unzip -o project.zip
            rm project.zip
          else
            echo "project.zip not found"
          fi

      - name: Get Unity Version
        id: unity-version
        run: |
          VERSION=$(grep 'm_EditorVersion:' ProjectSettings/ProjectVersion.txt | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Unity Engine
        uses: game-ci/unity-request-activation@v4
        id: unity-setup
        with:
          unityVersion: ${{ steps.unity-version.outputs.version }}

      - name: Execute Raw Unity Build Command
        run: |
          export UNITY_LICENSE="${{ secrets.UNITY_LICENSE }}"
          unity-editor \
            -batchmode \
            -nographics \
            -username "${{ secrets.UNITY_EMAIL }}" \
            -password "${{ secrets.UNITY_PASSWORD }}" \
            -projectPath . \
            -buildTarget Android \
            -executeMethod UnityEditor.BuildPipeline.BuildPlayer \
            -logFile -
