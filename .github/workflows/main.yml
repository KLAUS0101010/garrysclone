name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false

      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Unpack Project ZIP
        run: |
          if [ -f project.zip ]; then
            unzip -o project.zip
            rm project.zip
          else
            echo "project.zip not found"
          fi

      - name: Get Unity Version
        id: unity-version
        run: |
          VERSION=$(grep 'm_EditorVersion:' ProjectSettings/ProjectVersion.txt | awk '{print $2}')
          echo "Detected Unity Version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Run Unity Builder
        uses: game-ci/unity-builder@v4
        id: unity-build-step
        continue-on-error: true # Не даем упасть всему процессу, чтобы успеть забрать логи из контейнера
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: ${{ steps.unity-version.outputs.version }}
          androidExportType: androidPackage
          androidTargetSdkVersion: AndroidApiLevel34
          buildName: GmodMobile
          versioningStrategy: None
          allowDirtyBuild: true
          customParameters: -logFile /github/workspace/unity_build_log.txt # Заставляем Unity писать лог прямо в твою рабочую папку

      - name: Upload Real Unity Log
        if: always() # Выполнить при любом раскладе
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Editor-Log
          path: unity_build_log.txt # Теперь файл гарантированно будет лежать здесь

      - name: Check Build Status
        if: steps.unity-build-step.outcome == 'failure'
        run: exit 1 # Честно красим сборку в красный, если билд внутри Unity реально не удался

      - uses: actions/upload-artifact@v4
        if: steps.unity-build-step.outcome == 'success'
        with:
          name: GmodMobile-apk
          path: build/Android/*.apk
          retention-days: 14
